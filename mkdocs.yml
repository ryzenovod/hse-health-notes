site_name: Конспекты · Управление и экономика здравоохранения
site_description: Студенческая база знаний магистратуры НИУ ВШЭ
site_url: https://ryzenovod.github.io/hse-health-notes/
repo_url: https://github.com/ryzenovod/hse-health-notes
repo_name: ryzenovod/hse-health-notes
edit_uri: ""

theme:
  name: material
  custom_dir: overrides
  language: ru
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Включить тёмную тему
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Включить светлую тему
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search:
      lang: ru

markdown_extensions:
  - meta
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra:
  generator: false

nav:
  - Главная: index.md
  - Конспекты:
      - Все конспекты: year-1/notes.md
      - Организация и экономика здравоохранения: module-1/epidemiology-lecture-1.md
      - Продольные исследования и доказательная практика: module-1/epidemiology-lecture-2.md
      - Социальные основы медицины и доказательная медицина: module-1/epidemiology-social-medicine-proof.md
      - Курсовая книга по Экономике общественного сектора: year-1/public-sector-economics-coursebook.md
      - Управление медицинскими и страховыми организациями:
          - Управление изменениями: year-1/healthcare-management-and-change.md
      - Общественный выбор и бюрократия: year-1/public-sector-economics-public-choice.md
      - Налоги и бюджетный федерализм: year-1/public-sector-economics-lecture-tax-system.md
      - Налоговое бремя и эластичность: year-1/public-sector-economics-lecture-tax-incidence.md
      - Шпаргалка по налоговому бремени: year-1/public-sector-economics-tax-incidence-cheatsheet.md
      - Материалы и подготовка по ЭОС: year-1/public-sector-economics-materials.md
      - Микроэкономика для неэкономистов:
          - Обзор: year-1/public-sector-economics-microeconomics.md
          - Модуль 1: year-1/public-sector-economics-microeconomics-module-1.md
          - Модуль 2: year-1/public-sector-economics-microeconomics-module-2.md
          - Модуль 3: year-1/public-sector-economics-microeconomics-module-3.md
          - Модуль 4: year-1/public-sector-economics-microeconomics-module-4.md
          - Модуль 5: year-1/public-sector-economics-microeconomics-module-5.md
          - Шпаргалка: year-1/public-sector-economics-microeconomics-cheatsheet.md
  - 1 курс:
      - Обзор дисциплин: year-1/index.md
      - Важное: year-1/important.md
      - Обязательные:
          - Организация и экономика здравоохранения:
              - Карта курса: year-1/healthcare-economics.md
              - Как мы узнаём правду в медицине: module-1/epidemiology-lecture-1.md
              - Продольные исследования и доказательная практика: module-1/epidemiology-lecture-2.md
              - Социальные основы медицины и доказательная медицина: module-1/epidemiology-social-medicine-proof.md
          - Правовое обеспечение: year-1/legal-healthcare.md
          - Теория госуправления: year-1/public-administration.md
          - Управление социальной сферой: year-1/social-sector.md
          - Медицинские и страховые организации:
              - Карта курса: year-1/medical-organizations.md
              - Управление изменениями: year-1/healthcare-management-and-change.md
          - Экономика общественного сектора:
              - Карта курса: year-1/public-sector-economics.md
              - Курсовая книга: year-1/public-sector-economics-coursebook.md
              - Общественный выбор и бюрократия: year-1/public-sector-economics-public-choice.md
              - Налоги и бюджетный федерализм: year-1/public-sector-economics-lecture-tax-system.md
              - Налоговое бремя и эластичность: year-1/public-sector-economics-lecture-tax-incidence.md
              - Шпаргалка по налоговому бремени: year-1/public-sector-economics-tax-incidence-cheatsheet.md
              - Материалы и подготовка: year-1/public-sector-economics-materials.md
              - Модели и графики: year-1/public-sector-economics-welfare.md
              - Задачи с решениями: year-1/public-sector-economics-practice-archive.md
              - Словарь: year-1/public-sector-economics-dictionary.md
              - Вопросы и тесты: year-1/public-sector-economics-exam-bank.md
      - Ключевые семинары:
          - Научно-исследовательский семинар: year-1/research-seminar.md
          - Семинар наставника: year-1/mentor-seminar.md
      - По выбору:
          - Бизнес-планирование: year-1/business-planning.md
          - Управление качеством: year-1/quality-management.md
          - Управление человеческими ресурсами: year-1/human-resources.md
          - Ценностно-ориентированное здравоохранение: year-1/value-based-healthcare.md
  - 2 курс:
      - Обзор дисциплин: year-2/index.md
      - Информационно-аналитические технологии: year-2/healthcare-analytics.md
      - Медицинское страхование: year-2/health-insurance.md
      - Организация и экономика здравоохранения - 2: year-2/healthcare-economics-2.md
      - Лекарственное обеспечение: year-2/pharmaceutical-provision.md
