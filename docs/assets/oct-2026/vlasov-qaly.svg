<polyline points="90.000,270.000 235.000,270.000 235.000,300.000 525.000,300.000 525.000,480.000 670.000,480.000" fill="none" fill-opacity="1" stroke="#dd5a24" stroke-width="4" stroke-linejoin="round"/>
