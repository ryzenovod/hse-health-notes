<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 670" role="img" aria-labelledby="title desc">
<title id="title">QALY: потеря сегодня, выигрыш позже</title><desc id="desc">Учебный пример. Вмешательство: 0,4 в первый год, 0,8 в следующие три. Альтернатива: 0,7 в первый год, 0,6 в следующие два, затем 0. Площади 2,8 и 1,9 QALY; потеря 0,3, выигрыш 1,2, разница 0,9 QALY.</desc>
<style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#18213a;font-size:18px} .small{font-size:16px;fill:#54627a} .heading{font-size:23px;font-weight:650}</style>
