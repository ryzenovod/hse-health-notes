<text x="90.00" y="614.00" text-anchor="start" class="" style="fill:#18213a">Разница: 1,2 − 0,3 = 0,9 QALY</text>
<text x="90.00" y="648.00" text-anchor="start" class="small" style="fill:#18213a">Учебный пример · площадь = годы × вес полезности</text>
