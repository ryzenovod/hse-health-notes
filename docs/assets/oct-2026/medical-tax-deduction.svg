<title id="title">Вычет на медицинские расходы</title><desc id="desc">При полном использовании вычета с коэффициентом τ пациент оплачивает (1−τ)Ps. В координатах цены поставщика спрос D(Q)/(1−τ) выше исходного. Услуг больше, цена поставщика выше, расходы пациента на единицу ниже.</desc>
