<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Налоговый клин, налоговые поступления и DWL</title>
  <desc id="desc">Сравнение рыночного равновесия до и после введения специфического налога.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#5f6b85"/>
    </marker>
    <style>
      .bg{fill:#fff}.card{fill:#f5f6ff;stroke:#d9def2;stroke-width:1.5}
      .title{font:700 24px Inter,Arial,sans-serif;fill:#18213a}
      .sub{font:600 16px Inter,Arial,sans-serif;fill:#18213a}
      .small{font:500 13px Inter,Arial,sans-serif;fill:#5f6b85}
      .axis{stroke:#5f6b85;stroke-width:2}
      .grid{stroke:#c9cee0;stroke-width:1;stroke-dasharray:4 5}
      .d{stroke:#3f51b5;stroke-width:4;fill:none}
      .s{stroke:#2e7d32;stroke-width:4;fill:none}
      .st{stroke:#f4511e;stroke-width:4;fill:none}
      .eq{fill:#18213a}
      .tax{fill:#f4511e;opacity:.18}
      .dwl{fill:#f4511e;opacity:.42}
      .cs{fill:#3f51b5;opacity:.15}
      .ps{fill:#2e7d32;opacity:.15}
      .label{font:700 13px Inter,Arial,sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1200" height="560" rx="28"/>
  <text x="60" y="48" class="title">Налоговый клин: что меняется после введения t</text>
  <text x="60" y="76" class="small">Специфический налог сдвигает предложение параллельно; часть сделок исчезает, возникает DWL.</text>

  <rect class="card" x="45" y="105" width="535" height="405" rx="22"/>
  <rect class="card" x="620" y="105" width="535" height="405" rx="22"/>
  <text x="85" y="145" class="sub">До налога</text>
  <text x="660" y="145" class="sub">После налога</text>

  <!-- left axes -->
  <line x1="105" y1="450" x2="105" y2="175" class="axis" marker-end="url(#a)"/>
  <line x1="105" y1="450" x2="520" y2="450" class="axis" marker-end="url(#a)"/>
  <text x="92" y="176" class="label" text-anchor="end">P</text>
  <text x="526" y="468" class="label">Q</text>
  <line x1="105" y1="315" x2="385" y2="315" class="grid"/>
  <line x1="385" y1="450" x2="385" y2="315" class="grid"/>
  <path d="M105 190 L500 420" class="d"/>
  <path d="M105 425 L500 195" class="s"/>
  <polygon points="105,190 385,315 105,315" class="cs"/>
  <polygon points="105,425 385,315 105,315" class="ps"/>
  <circle cx="385" cy="315" r="6" class="eq"/>
  <text x="394" y="307" class="label" fill="#18213a">E₀</text>
  <text x="110" y="309" class="small">P*</text>
  <text x="385" y="472" class="small" text-anchor="middle">Q*</text>
  <text x="465" y="435" class="label" fill="#3f51b5">D</text>
  <text x="465" y="220" class="label" fill="#2e7d32">S</text>
  <text x="150" y="270" class="small">CS</text>
  <text x="150" y="370" class="small">PS</text>

  <!-- right axes -->
  <line x1="680" y1="450" x2="680" y2="175" class="axis" marker-end="url(#a)"/>
  <line x1="680" y1="450" x2="1095" y2="450" class="axis" marker-end="url(#a)"/>
  <text x="667" y="176" class="label" text-anchor="end">P</text>
  <text x="1101" y="468" class="label">Q</text>
  <path d="M680 190 L1075 420" class="d"/>
  <path d="M680 425 L1075 195" class="s"/>
  <path d="M680 365 L1075 135" class="st"/>
  <polygon points="680,255 850,355 850,405 680,355" class="tax"/>
  <polygon points="850,355 910,390 850,405" class="dwl"/>
  <line x1="680" y1="255" x2="850" y2="255" class="grid"/>
  <line x1="680" y1="355" x2="850" y2="355" class="grid"/>
  <line x1="850" y1="450" x2="850" y2="355" class="grid"/>
  <circle cx="850" cy="355" r="6" fill="#f4511e"/>
  <text x="858" y="347" class="label" fill="#f4511e">E₁</text>
  <text x="667" y="259" class="small" text-anchor="end">Pᴅ</text>
  <text x="667" y="359" class="small" text-anchor="end">Pˢ</text>
  <text x="850" y="472" class="small" text-anchor="middle">Q₁</text>
  <text x="1060" y="435" class="label" fill="#3f51b5">D</text>
  <text x="1060" y="205" class="label" fill="#2e7d32">S₀</text>
  <text x="1060" y="150" class="label" fill="#f4511e">S₀ + t</text>
  <text x="755" y="307" class="label" fill="#f4511e">налоговые поступления</text>
  <text x="870" y="388" class="label" fill="#b93816">DWL</text>
  <text x="930" y="497" class="small">Q₁ &lt; Q*</text>
</svg>