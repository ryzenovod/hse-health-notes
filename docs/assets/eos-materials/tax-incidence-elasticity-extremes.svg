<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Распределение налогового бремени при крайних эластичностях</title>
  <desc id="desc">Четыре крайних случая эластичности спроса и предложения.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#5f6b85"/>
    </marker>
    <style>
      .bg{fill:#fff}.card{fill:#f5f6ff;stroke:#d9def2;stroke-width:1.5}
      .title{font:700 24px Inter,Arial,sans-serif;fill:#18213a}
      .sub{font:700 16px Inter,Arial,sans-serif;fill:#18213a}
      .small{font:500 12px Inter,Arial,sans-serif;fill:#5f6b85}
      .axis{stroke:#5f6b85;stroke-width:1.8}.grid{stroke:#c9cee0;stroke-width:1;stroke-dasharray:4 5}
      .d{stroke:#3f51b5;stroke-width:3.5;fill:none}.s{stroke:#2e7d32;stroke-width:3.5;fill:none}.st{stroke:#f4511e;stroke-width:3.5;fill:none}
      .burden{fill:#f4511e;opacity:.18}.dot{fill:#18213a}.badge{font:700 12px Inter,Arial,sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1200" height="780" rx="28"/>
  <text x="60" y="48" class="title">Кто несёт налог? Смотрим на эластичность</text>
  <text x="60" y="76" class="small">Крайние случаи показывают логику правила: менее эластичная сторона принимает на себя большую часть клина.</text>

  <!-- a -->
  <g transform="translate(45,105)">
    <rect class="card" width="535" height="305" rx="22"/>
    <text x="28" y="36" class="sub">A · εᴅ = 0 — спрос абсолютно неэластичен</text>
    <line x1="60" y1="255" x2="60" y2="65" class="axis" marker-end="url(#a)"/>
    <line x1="60" y1="255" x2="485" y2="255" class="axis" marker-end="url(#a)"/>
    <path d="M110 235 L450 70" class="s"/><path d="M110 185 L450 20" class="st"/>
    <path d="M270 55 L270 255" class="d"/>
    <line x1="60" y1="135" x2="270" y2="135" class="grid"/><line x1="60" y1="185" x2="270" y2="185" class="grid"/>
    <line x1="60" y1="135" x2="60" y2="185" class="burden"/>
    <circle cx="270" cy="185" r="5" class="dot"/><circle cx="270" cy="135" r="5" fill="#f4511e"/>
    <text x="286" y="80" class="badge" fill="#3f51b5">D</text>
    <text x="448" y="78" class="badge" fill="#2e7d32">S₀</text><text x="448" y="30" class="badge" fill="#f4511e">S₀+t</text>
    <text x="78" y="128" class="small">Pᴅ</text><text x="78" y="180" class="small">Pˢ</text>
    <text x="270" y="278" class="small" text-anchor="middle">Q₀ = Q₁</text>
    <text x="330" y="205" class="badge" fill="#f4511e">100% бремени → покупателю</text>
  </g>

  <!-- b -->
  <g transform="translate(620,105)">
    <rect class="card" width="535" height="305" rx="22"/>
    <text x="28" y="36" class="sub">B · εᴅ → ∞ — спрос абсолютно эластичен</text>
    <line x1="60" y1="255" x2="60" y2="65" class="axis" marker-end="url(#a)"/>
    <line x1="60" y1="255" x2="485" y2="255" class="axis" marker-end="url(#a)"/>
    <path d="M70 135 L470 135" class="d"/>
    <path d="M110 235 L430 70" class="s"/><path d="M110 185 L430 20" class="st"/>
    <line x1="60" y1="185" x2="270" y2="185" class="grid"/><line x1="60" y1="135" x2="270" y2="135" class="grid"/>
    <circle cx="280" cy="135" r="5" class="dot"/><circle cx="180" cy="135" r="5" fill="#f4511e"/>
    <text x="472" y="129" class="badge" fill="#3f51b5">D</text>
    <text x="430" y="78" class="badge" fill="#2e7d32">S₀</text><text x="430" y="30" class="badge" fill="#f4511e">S₀+t</text>
    <text x="180" y="278" class="small" text-anchor="middle">Q₁</text><text x="280" y="278" class="small" text-anchor="middle">Q₀</text>
    <text x="300" y="205" class="badge" fill="#f4511e">100% бремени → продавцу</text>
  </g>

  <!-- c -->
  <g transform="translate(45,445)">
    <rect class="card" width="535" height="305" rx="22"/>
    <text x="28" y="36" class="sub">C · εˢ = 0 — предложение абсолютно неэластично</text>
    <line x1="60" y1="255" x2="60" y2="65" class="axis" marker-end="url(#a)"/>
    <line x1="60" y1="255" x2="485" y2="255" class="axis" marker-end="url(#a)"/>
    <path d="M270 55 L270 255" class="s"/>
    <path d="M100 70 L430 235" class="d"/>
    <line x1="60" y1="135" x2="270" y2="135" class="grid"/><line x1="60" y1="185" x2="270" y2="185" class="grid"/>
    <line x1="60" y1="135" x2="270" y2="135" class="burden"/><line x1="60" y1="185" x2="270" y2="185" class="grid"/>
    <circle cx="270" cy="135" r="5" fill="#f4511e"/><circle cx="270" cy="185" r="5" class="dot"/>
    <text x="286" y="78" class="badge" fill="#2e7d32">S</text><text x="430" y="235" class="badge" fill="#3f51b5">D</text>
    <text x="78" y="128" class="small">Pᴅ</text><text x="78" y="180" class="small">Pˢ</text>
    <text x="270" y="278" class="small" text-anchor="middle">Q₀ = Q₁</text>
    <text x="315" y="205" class="badge" fill="#f4511e">100% бремени → продавцу</text>
  </g>

  <!-- d -->
  <g transform="translate(620,445)">
    <rect class="card" width="535" height="305" rx="22"/>
    <text x="28" y="36" class="sub">D · εˢ → ∞ — предложение абсолютно эластично</text>
    <line x1="60" y1="255" x2="60" y2="65" class="axis" marker-end="url(#a)"/>
    <line x1="60" y1="255" x2="485" y2="255" class="axis" marker-end="url(#a)"/>
    <path d="M70 185 L470 185" class="s"/><path d="M70 135 L470 135" class="st"/>
    <path d="M100 70 L430 235" class="d"/>
    <circle cx="285" cy="185" r="5" class="dot"/><circle cx="185" cy="135" r="5" fill="#f4511e"/>
    <line x1="185" y1="135" x2="185" y2="255" class="grid"/><line x1="285" y1="185" x2="285" y2="255" class="grid"/>
    <text x="472" y="180" class="badge" fill="#2e7d32">S₀</text><text x="472" y="130" class="badge" fill="#f4511e">S₀+t</text>
    <text x="430" y="235" class="badge" fill="#3f51b5">D</text>
    <text x="185" y="278" class="small" text-anchor="middle">Q₁</text><text x="285" y="278" class="small" text-anchor="middle">Q₀</text>
    <text x="300" y="205" class="badge" fill="#f4511e">100% бремени → покупателю</text>
  </g>
</svg>