<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Водка и шоколад: налоговое бремя при разной эластичности спроса</title>
  <desc id="desc">Сравнение неэластичного и эластичного спроса и распределения налогового клина.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#5f6b85"/>
    </marker>
    <style>
      .bg{fill:#fff}.card{fill:#f5f6ff;stroke:#d9def2;stroke-width:1.5}
      .title{font:700 24px Inter,Arial,sans-serif;fill:#18213a}.sub{font:700 17px Inter,Arial,sans-serif;fill:#18213a}
      .small{font:500 13px Inter,Arial,sans-serif;fill:#5f6b85}.axis{stroke:#5f6b85;stroke-width:2}
      .grid{stroke:#c9cee0;stroke-width:1;stroke-dasharray:4 5}.d{stroke:#3f51b5;stroke-width:4;fill:none}
      .s{stroke:#2e7d32;stroke-width:3.5;fill:none}.st{stroke:#f4511e;stroke-width:3.5;fill:none}
      .wedge{fill:#f4511e;opacity:.18}.label{font:700 13px Inter,Arial,sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1200" height="560" rx="28"/>
  <text x="60" y="48" class="title">Один и тот же налог — разное распределение бремени</text>
  <text x="60" y="76" class="small">Чем менее эластичен спрос, тем большую долю клина можно переложить на покупателя.</text>

  <rect class="card" x="45" y="105" width="535" height="405" rx="22"/>
  <rect class="card" x="620" y="105" width="535" height="405" rx="22"/>
  <text x="75" y="145" class="sub">Водка · спрос неэластичен</text>
  <text x="650" y="145" class="sub">Шоколад · спрос эластичен</text>

  <!-- vodka -->
  <line x1="105" y1="450" x2="105" y2="175" class="axis" marker-end="url(#a)"/>
  <line x1="105" y1="450" x2="520" y2="450" class="axis" marker-end="url(#a)"/>
  <path d="M170 185 L290 430" class="d"/>
  <path d="M115 415 L500 210" class="s"/><path d="M115 355 L500 150" class="st"/>
  <polygon points="245,270 265,312 245,325 225,283" class="wedge"/>
  <line x1="105" y1="270" x2="245" y2="270" class="grid"/><line x1="105" y1="325" x2="245" y2="325" class="grid"/>
  <text x="178" y="180" class="label" fill="#3f51b5">D</text>
  <text x="500" y="215" class="label" fill="#2e7d32">S₀</text><text x="500" y="155" class="label" fill="#f4511e">S₀+t</text>
  <text x="112" y="264" class="small">Pᴅ</text><text x="112" y="320" class="small">Pˢ</text>
  <text x="300" y="492" class="label" fill="#f4511e">Большая часть t → покупателю</text>
  <text x="300" y="470" class="small">Цена покупателя растёт заметно, выпуск меняется мало.</text>

  <!-- chocolate -->
  <line x1="680" y1="450" x2="680" y2="175" class="axis" marker-end="url(#a)"/>
  <line x1="680" y1="450" x2="1095" y2="450" class="axis" marker-end="url(#a)"/>
  <path d="M735 250 L1065 335" class="d"/>
  <path d="M690 415 L1070 210" class="s"/><path d="M690 355 L1070 150" class="st"/>
  <polygon points="850,285 900,296 850,350 800,338" class="wedge"/>
  <line x1="680" y1="285" x2="850" y2="285" class="grid"/><line x1="680" y1="338" x2="850" y2="338" class="grid"/>
  <text x="1068" y="338" class="label" fill="#3f51b5">D</text>
  <text x="1070" y="215" class="label" fill="#2e7d32">S₀</text><text x="1070" y="155" class="label" fill="#f4511e">S₀+t</text>
  <text x="688" y="279" class="small">Pᴅ</text><text x="688" y="333" class="small">Pˢ</text>
  <text x="870" y="492" class="label" fill="#f4511e">Большая часть t → продавцу</text>
  <text x="870" y="470" class="small">Покупатель легко сокращает спрос или меняет товар.</text>
</svg>