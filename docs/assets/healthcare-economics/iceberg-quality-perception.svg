<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" role="img" aria-labelledby="title desc">
<title id="title">Модель айсберга: восприятие качества медицины пациентом</title><desc id="desc">Сравнение видимой верхушки (сервис и эмпатия) и подводной толщи (клиническая безопасность и стерильность).</desc>
<style>text{font-family:Inter,system-ui,-apple-system,sans-serif;fill:#18213a;font-size:15px} .small{font-size:13px;fill:#54627a} .heading{font-size:20px;font-weight:700} .bold{font-weight:600}</style>
<rect width="760" height="510" rx="12" fill="#fff"/>
<text x="32.00" y="40.00" text-anchor="start" class="heading" style="fill:#18213a">Модель айсберга: восприятие качества медицины пациентом</text>
<text x="32.00" y="66.00" text-anchor="start" class="small" style="fill:#18213a">Пациент оценивает отношение и чистоту, но его жизнь спасает подводная часть системы</text>
<rect x="32.00" y="90.00" width="696.00" height="104.00" rx="8" fill="#f0f7ff" stroke="#b3d7ff" stroke-width="1"/>
<rect x="46.00" y="102.00" width="130.00" height="26.00" rx="6" fill="#0288d1"/>
<text x="111.00" y="119.00" text-anchor="middle" class="bold" style="font-size:11px;fill:#fff">ВЕРХУШКА (15%)</text>
<text x="188.00" y="119.00" text-anchor="start" class="bold" style="font-size:12px;fill:#0277bd">Видимый сервис: то, на основе чего пациент формирует выбор</text>
<rect x="46.00" y="134.00" width="328.00" height="48.00" rx="6" fill="#fff" stroke="#cbe3fb" stroke-width="1"/>
<text x="58.00" y="153.00" text-anchor="start" class="" style="font-size:10.5px;fill:#18213a">• Эмпатия врача, уважительный диалог без сарказма</text>
<text x="58.00" y="171.00" text-anchor="start" class="" style="font-size:10px;fill:#54627a">• Понятное объяснение плана лечения и прогноза</text>
<rect x="386.00" y="134.00" width="328.00" height="48.00" rx="6" fill="#fff" stroke="#cbe3fb" stroke-width="1"/>
<text x="398.00" y="153.00" text-anchor="start" class="" style="font-size:10.5px;fill:#18213a">• Чистота палат, горячее питание, понятная навигация</text>
<text x="398.00" y="171.00" text-anchor="start" class="" style="font-size:10px;fill:#54627a">• Быстрая запись через приложение, без очередей</text>
<path d="M32.000,208.000 L728.000,208.000" fill="none" stroke="#0288d1" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="235.00" y="197.00" width="290.00" height="22.00" rx="11" fill="#e1f0fe" stroke="#0288d1" stroke-width="1"/>
<text x="380.00" y="212.00" text-anchor="middle" class="bold" style="font-size:10px;fill:#01579b">ВАТЕРЛИНИЯ ВОСПРИЯТИЯ ПАЦИЕНТА</text>
<rect x="32.00" y="226.00" width="696.00" height="202.00" rx="8" fill="#eef4fb" stroke="#90b8e4" stroke-width="1"/>
<rect x="46.00" y="238.00" width="175.00" height="26.00" rx="6" fill="#1a365d"/>
<text x="133.00" y="255.00" text-anchor="middle" class="bold" style="font-size:11px;fill:#fff">ПОДВОДНАЯ ЧАСТЬ (85%)</text>
<text x="233.00" y="255.00" text-anchor="start" class="bold" style="font-size:12px;fill:#1a365d">Фундамент безопасности: пациент не может оценить профессионально</text>
<rect x="46.00" y="272.00" width="328.00" height="44.00" rx="6" fill="#fff" stroke="#b9d3ef" stroke-width="1"/>
<text x="56.00" y="290.00" text-anchor="start" class="bold" style="font-size:11px;fill:#0d47a1">Стерильность и санэпидрежим</text>
<text x="56.00" y="307.00" text-anchor="start" class="" style="font-size:9.8px;fill:#54627a">Контроль ИСМП, ламинарный поток в операционных</text>
<rect x="386.00" y="272.00" width="328.00" height="44.00" rx="6" fill="#fff" stroke="#b9d3ef" stroke-width="1"/>
<text x="396.00" y="290.00" text-anchor="start" class="bold" style="font-size:11px;fill:#0d47a1">Чек-листы ВОЗ и тайм-ауты</text>
<text x="396.00" y="307.00" text-anchor="start" class="" style="font-size:9.8px;fill:#54627a">Тайм-аут перед разрезом, сверка стороны и салфеток</text>
<rect x="46.00" y="321.00" width="328.00" height="44.00" rx="6" fill="#fff" stroke="#b9d3ef" stroke-width="1"/>
<text x="56.00" y="339.00" text-anchor="start" class="bold" style="font-size:11px;fill:#0d47a1">Калибровка оборудования</text>
<text x="56.00" y="356.00" text-anchor="start" class="" style="font-size:9.8px;fill:#54627a">Поверка томографов, наркозных аппаратов и дозаторов</text>
<rect x="386.00" y="321.00" width="328.00" height="44.00" rx="6" fill="#fff" stroke="#b9d3ef" stroke-width="1"/>
<text x="396.00" y="339.00" text-anchor="start" class="bold" style="font-size:11px;fill:#0d47a1">Фармаконадзор и совместимость</text>
<text x="396.00" y="356.00" text-anchor="start" class="" style="font-size:9.8px;fill:#54627a">Двойной контроль введения высокорисковых лекарств</text>
<rect x="46.00" y="370.00" width="328.00" height="44.00" rx="6" fill="#fff" stroke="#b9d3ef" stroke-width="1"/>
<text x="56.00" y="388.00" text-anchor="start" class="bold" style="font-size:11px;fill:#0d47a1">M&amp;M-конференции по ошибкам</text>
<text x="56.00" y="405.00" text-anchor="start" class="" style="font-size:9.8px;fill:#54627a">Системный разбор осложнений без поиска козла отпущения</text>
<rect x="386.00" y="370.00" width="328.00" height="44.00" rx="6" fill="#fff" stroke="#b9d3ef" stroke-width="1"/>
<text x="396.00" y="388.00" text-anchor="start" class="bold" style="font-size:11px;fill:#0d47a1">Симуляционные учения бригад</text>
<text x="396.00" y="405.00" text-anchor="start" class="" style="font-size:9.8px;fill:#54627a">Внезапные тренировки экстренной сердечной реанимации</text>
<rect x="32.00" y="442.00" width="696.00" height="50.00" rx="8" fill="#fff9e6" stroke="#fbc02d" stroke-width="1"/>
<text x="380.00" y="462.00" text-anchor="middle" class="bold" style="font-size:11px;fill:#e65100">Парадокс восприятия: невкусный кофе отпугнет пациента быстрее, чем слабая вентиляция.</text>
<text x="380.00" y="480.00" text-anchor="middle" class="" style="font-size:10.5px;fill:#b78103">Но без скрытого фундамента безопасность рушится, приводя к сепсису и летальности.</text>
</svg>
