<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" role="img" aria-labelledby="title desc">
<title id="title">5 стадий гибели великих компаний (по Джиму Коллинзу)</title><desc id="desc">Закономерности деградации лидеров рынка и клиник при потере контакта с реальностью.</desc>
<style>text{font-family:Inter,system-ui,-apple-system,sans-serif;fill:#18213a;font-size:15px} .small{font-size:13px;fill:#54627a} .heading{font-size:20px;font-weight:700} .bold{font-weight:600}</style>
<rect width="760" height="490" rx="12" fill="#fff"/>
<text x="32.00" y="40.00" text-anchor="start" class="heading" style="fill:#18213a">5 стадий гибели великих компаний (по Джиму Коллинзу)</text>
<text x="32.00" y="66.00" text-anchor="start" class="small" style="fill:#18213a">От Kodak и Nokia до неэффективных медицинских гигантов: траектория упадка</text>
<rect x="32.00" y="90.00" width="195.00" height="48.00" rx="6" fill="#1e88e5"/>
<text x="44.00" y="111.00" text-anchor="start" class="bold" style="font-size:11px;fill:#fff">1. Высокомерие от успехов</text>
<text x="44.00" y="128.00" text-anchor="start" class="" style="font-size:9.5px;fill:#bbdefb">Hubris Born of Success</text>
<rect x="237.00" y="90.00" width="491.00" height="48.00" rx="6" fill="#f8fafd" stroke="#1e88e5" stroke-width="1"/>
<text x="250.00" y="110.00" text-anchor="start" class="" style="font-size:10.5px;fill:#18213a">«Мы лучшие, пациенты никуда не денутся». Потеря самокритики.</text>
<text x="250.00" y="127.00" text-anchor="start" class="" style="font-size:10px;fill:#54627a">Игнорирование конкурентов и технологических сдвигов среды.</text>
<path d="M129.000,138.000 L129.000,148.000" fill="none" stroke="#1e88e5" stroke-width="2"/>
<rect x="32.00" y="148.00" width="195.00" height="48.00" rx="6" fill="#3949ab"/>
<text x="44.00" y="169.00" text-anchor="start" class="bold" style="font-size:11px;fill:#fff">2. Безудержная экспансия</text>
<text x="44.00" y="186.00" text-anchor="start" class="" style="font-size:9.5px;fill:#bbdefb">Undisciplined Pursuit of More</text>
<rect x="237.00" y="148.00" width="491.00" height="48.00" rx="6" fill="#f8fafd" stroke="#3949ab" stroke-width="1"/>
<text x="250.00" y="168.00" text-anchor="start" class="" style="font-size:10.5px;fill:#18213a">Агрессивный рост коек и филиалов без квалифицированных кадров.</text>
<text x="250.00" y="185.00" text-anchor="start" class="" style="font-size:10px;fill:#54627a">Размывание стандартов клинического качества ради валового дохода.</text>
<path d="M129.000,196.000 L129.000,206.000" fill="none" stroke="#3949ab" stroke-width="2"/>
<rect x="32.00" y="206.00" width="195.00" height="48.00" rx="6" fill="#fb8c00"/>
<text x="44.00" y="227.00" text-anchor="start" class="bold" style="font-size:11px;fill:#fff">3. Отрицание рисков</text>
<text x="44.00" y="244.00" text-anchor="start" class="" style="font-size:9.5px;fill:#ffecb3">Denial of Risk and Peril</text>
<rect x="237.00" y="206.00" width="491.00" height="48.00" rx="6" fill="#f8fafd" stroke="#fb8c00" stroke-width="1"/>
<text x="250.00" y="226.00" text-anchor="start" class="" style="font-size:10.5px;fill:#18213a">Игнорирование роста осложнений. Наказание за плохие новости.</text>
<text x="250.00" y="243.00" text-anchor="start" class="" style="font-size:10px;fill:#54627a">Атмосфера страха: врачи начинают скрывать дефекты и ошибки.</text>
<path d="M129.000,254.000 L129.000,264.000" fill="none" stroke="#fb8c00" stroke-width="2"/>
<rect x="32.00" y="264.00" width="195.00" height="48.00" rx="6" fill="#e53935"/>
<text x="44.00" y="285.00" text-anchor="start" class="bold" style="font-size:11px;fill:#fff">4. Поиски «чудо-таблетки»</text>
<text x="44.00" y="302.00" text-anchor="start" class="" style="font-size:9.5px;fill:#ffecb3">Grasping for Salvation</text>
<rect x="237.00" y="264.00" width="491.00" height="48.00" rx="6" fill="#f8fafd" stroke="#e53935" stroke-width="1"/>
<text x="250.00" y="284.00" text-anchor="start" class="" style="font-size:10.5px;fill:#18213a">Судорожная смена главврачей, покупка дорогого ИИ ради «чуда».</text>
<text x="250.00" y="301.00" text-anchor="start" class="" style="font-size:10px;fill:#54627a">Хаотичные метания без выстраивания базовых процессов клиники.</text>
<path d="M129.000,312.000 L129.000,322.000" fill="none" stroke="#e53935" stroke-width="2"/>
<rect x="32.00" y="322.00" width="195.00" height="48.00" rx="6" fill="#8e0000"/>
<text x="44.00" y="343.00" text-anchor="start" class="bold" style="font-size:11px;fill:#fff">5. Капитуляция и крах</text>
<text x="44.00" y="360.00" text-anchor="start" class="" style="font-size:9.5px;fill:#ffecb3">Capitulation to Irrelevance</text>
<rect x="237.00" y="322.00" width="491.00" height="48.00" rx="6" fill="#f8fafd" stroke="#8e0000" stroke-width="1"/>
<text x="250.00" y="342.00" text-anchor="start" class="" style="font-size:10.5px;fill:#18213a">Потеря доверия персонала и пациентов, бегство ключевых врачей.</text>
<text x="250.00" y="359.00" text-anchor="start" class="" style="font-size:10px;fill:#54627a">Финансовая яма, банкротство или ликвидация организации.</text>
<rect x="32.00" y="395.00" width="696.00" height="65.00" rx="8" fill="#fff9e6" stroke="#e6b800" stroke-width="1"/>
<text x="48.00" y="417.00" text-anchor="start" class="bold" style="font-size:11px;fill:#997a00">Главный симптом необратимого упадка (стадия 3):</text>
<text x="48.00" y="434.00" text-anchor="start" class="" style="font-size:10.5px;fill:#18213a">Подчиненные боятся сообщать руководителю о реальных инцидентах и врачебных ошибках.</text>
<text x="48.00" y="449.00" text-anchor="start" class="" style="font-size:10px;fill:#54627a">Культура страха и сокрытия неизбежно толкает организацию к стадиям 4 и 5.</text>
</svg>
