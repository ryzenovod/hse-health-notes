<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
<title id="title">Модель эмпатичного лидерства: уроки сериала «Тед Лассо»</title><desc id="desc">Как вера в команду, неформальное доверие и внимание к деталям создают победную культуру.</desc>
<style>text{font-family:Inter,system-ui,-apple-system,sans-serif;fill:#18213a;font-size:15px} .small{font-size:13px;fill:#54627a} .heading{font-size:20px;font-weight:700} .bold{font-weight:600}</style>
<rect width="760" height="470" rx="12" fill="#fff"/>
<text x="32.00" y="40.00" text-anchor="start" class="heading" style="fill:#18213a">Модель эмпатичного лидерства: уроки сериала «Тед Лассо»</text>
<text x="32.00" y="66.00" text-anchor="start" class="small" style="fill:#18213a">Инструменты мягкой силы лидера: от утреннего печенья до психологической безопасности</text>
<rect x="260.00" y="90.00" width="240.00" height="52.00" rx="8" fill="#fbc02d" stroke="#f57f17" stroke-width="2"/>
<text x="380.00" y="122.00" text-anchor="middle" class="heading" style="font-size:24px;fill:#0d47a1">BELIEVE</text>
<text x="380.00" y="136.00" text-anchor="middle" class="" style="font-size:9.5px;fill:#1565c0">Вера в потенциал команды и право на ошибку</text>
<path d="M380.000,142.000 L142.000,172.000" fill="none" stroke="#fbc02d" stroke-width="2"/>
<path d="M380.000,142.000 L380.000,172.000" fill="none" stroke="#fbc02d" stroke-width="2"/>
<path d="M380.000,142.000 L618.000,172.000" fill="none" stroke="#fbc02d" stroke-width="2"/>
<rect x="32.00" y="172.00" width="220.00" height="168.00" rx="8" fill="#f8fbff" stroke="#1976d2" stroke-width="1.5"/>
<rect x="32.00" y="172.00" width="220.00" height="40.00" rx="8" fill="#1976d2"/>
<rect x="32.00" y="198.00" width="220.00" height="14.00" rx="0" fill="#1976d2"/>
<text x="142.00" y="190.00" text-anchor="middle" class="bold" style="font-size:11px;fill:#fff">Тренер Бирд (Coach Beard)</text>
<text x="142.00" y="204.00" text-anchor="middle" class="" style="font-size:9.5px;fill:#bbdefb">Системный балансир</text>
<text x="42.00" y="230.00" text-anchor="start" class="" style="font-size:10px;fill:#18213a">• Тихий стратег за спиной лидера</text>
<text x="42.00" y="256.00" text-anchor="start" class="" style="font-size:10px;fill:#18213a">• Знание правил и регламентов</text>
<text x="42.00" y="282.00" text-anchor="start" class="" style="font-size:10px;fill:#18213a">• Холодный расчет без паники</text>
<text x="42.00" y="308.00" text-anchor="start" class="" style="font-size:10px;fill:#18213a">• Балансирует эмоции команды</text>
<rect x="270.00" y="172.00" width="220.00" height="168.00" rx="8" fill="#f6fbf7" stroke="#2e7d32" stroke-width="1.5"/>
<rect x="270.00" y="172.00" width="220.00" height="40.00" rx="8" fill="#2e7d32"/>
<rect x="270.00" y="198.00" width="220.00" height="14.00" rx="0" fill="#2e7d32"/>
<text x="380.00" y="190.00" text-anchor="middle" class="bold" style="font-size:11px;fill:#fff">Печенье с боссом (Biscuits)</text>
<text x="380.00" y="204.00" text-anchor="middle" class="" style="font-size:9.5px;fill:#c8e6c9">Культура неформального доверия</text>
<text x="280.00" y="230.00" text-anchor="start" class="" style="font-size:10px;fill:#18213a">• 15 минут в день без повесток</text>
<text x="280.00" y="256.00" text-anchor="start" class="" style="font-size:10px;fill:#18213a">• Разрушение барьера власти</text>
<text x="280.00" y="282.00" text-anchor="start" class="" style="font-size:10px;fill:#18213a">• Искренний интерес к человеку</text>
<text x="280.00" y="308.00" text-anchor="start" class="" style="font-size:10px;fill:#18213a">• Гашение конфликтов на старте</text>
<rect x="508.00" y="172.00" width="220.00" height="168.00" rx="8" fill="#fdf6f9" stroke="#c2185b" stroke-width="1.5"/>
<rect x="508.00" y="172.00" width="220.00" height="40.00" rx="8" fill="#c2185b"/>
<rect x="508.00" y="198.00" width="220.00" height="14.00" rx="0" fill="#c2185b"/>
<text x="618.00" y="190.00" text-anchor="middle" class="bold" style="font-size:11px;fill:#fff">Трагедия Нейта (Nate)</text>
<text x="618.00" y="204.00" text-anchor="middle" class="" style="font-size:9.5px;fill:#f8bbd0">Цена невнимания к талантам</text>
<text x="518.00" y="230.00" text-anchor="start" class="" style="font-size:10px;fill:#18213a">• Недооценка скромного ума</text>
<text x="518.00" y="256.00" text-anchor="start" class="" style="font-size:10px;fill:#18213a">• Дефицит признания ранит эго</text>
<text x="518.00" y="282.00" text-anchor="start" class="" style="font-size:10px;fill:#18213a">• Затаенная обида рождает яд</text>
<text x="518.00" y="308.00" text-anchor="start" class="" style="font-size:10px;fill:#18213a">• Забота о невидимых героях</text>
<rect x="32.00" y="360.00" width="696.00" height="68.00" rx="8" fill="#f0f7ff" stroke="#3859b5" stroke-width="1"/>
<text x="380.00" y="384.00" text-anchor="middle" class="bold" style="font-size:11.5px;fill:#3859b5">Принцип Уолта Уитмена: «Be curious, not judgmental» (Будь любознательным, а не осуждающим)</text>
<text x="380.00" y="402.00" text-anchor="middle" class="" style="font-size:10.5px;fill:#18213a">При ошибке сотрудника лидер выясняет системную причину сбоя, вместо крика и поиска виновных.</text>
<text x="380.00" y="418.00" text-anchor="middle" class="" style="font-size:10px;fill:#54627a">Побеждает культура психологической безопасности, а не страх репрессий.</text>
</svg>
