<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" role="img" aria-labelledby="title desc">
<title id="title">Ловушка цифровизации: Процесс → Цифровой контур → ИИ</title><desc id="desc">Почему автоматизация хаоса приводит к катастрофе: сравнение Babylon Health и ЕМИАС Москвы.</desc>
<style>text{font-family:Inter,system-ui,-apple-system,sans-serif;fill:#18213a;font-size:15px} .small{font-size:13px;fill:#54627a} .heading{font-size:20px;font-weight:700} .bold{font-weight:600}</style>
<rect width="760" height="490" rx="12" fill="#fff"/>
<text x="32.00" y="40.00" text-anchor="start" class="heading" style="fill:#18213a">Ловушка цифровизации: Процесс → Цифровой контур → ИИ</text>
<text x="32.00" y="66.00" text-anchor="start" class="small" style="fill:#18213a">Формула Ростислава Павлова: сначала стандартизация процессов, затем цифра, затем ИИ</text>
<rect x="32.00" y="90.00" width="696.00" height="142.00" rx="8" fill="#fff5f5" stroke="#b23b54" stroke-width="1.5"/>
<rect x="46.00" y="100.00" width="220.00" height="26.00" rx="6" fill="#b23b54"/>
<text x="156.00" y="117.00" text-anchor="middle" class="bold" style="font-size:11px;fill:#fff">Крах: Babylon Health (UK/USA)</text>
<text x="280.00" y="117.00" text-anchor="start" class="bold" style="font-size:11.5px;fill:#b23b54">Оценка $4.2 млрд → Банкротство с долгами -$1 млрд</text>
<rect x="46.00" y="138.00" width="152.00" height="74.00" rx="6" fill="#fff" stroke="#ffcdd2" stroke-width="1"/>
<text x="54.00" y="158.00" text-anchor="start" class="bold" style="font-size:10.5px;fill:#b23b54">1. Хаос в процессах</text>
<text x="54.00" y="178.00" text-anchor="start" class="" style="font-size:9.5px;fill:#54627a">Протоколы не согласованы,</text>
<text x="54.00" y="194.00" text-anchor="start" class="" style="font-size:9.5px;fill:#54627a">стандарты приема размыты</text>
<text x="210.00" y="180.00" text-anchor="middle" class="bold" style="font-size:15px;fill:#b23b54">→</text>
<rect x="222.00" y="138.00" width="152.00" height="74.00" rx="6" fill="#fff" stroke="#ffcdd2" stroke-width="1"/>
<text x="230.00" y="158.00" text-anchor="start" class="bold" style="font-size:10.5px;fill:#b23b54">2. Хайповый ИИ</text>
<text x="230.00" y="178.00" text-anchor="start" class="" style="font-size:9.5px;fill:#54627a">Чат-бот обучен на сырых</text>
<text x="230.00" y="194.00" text-anchor="start" class="" style="font-size:9.5px;fill:#54627a">и противоречивых данных</text>
<text x="386.00" y="180.00" text-anchor="middle" class="bold" style="font-size:15px;fill:#b23b54">→</text>
<rect x="398.00" y="138.00" width="152.00" height="74.00" rx="6" fill="#fff" stroke="#ffcdd2" stroke-width="1"/>
<text x="406.00" y="158.00" text-anchor="start" class="bold" style="font-size:10.5px;fill:#b23b54">3. Ошибки триажа</text>
<text x="406.00" y="178.00" text-anchor="start" class="" style="font-size:9.5px;fill:#54627a">Пропуск стенокардии,</text>
<text x="406.00" y="194.00" text-anchor="start" class="" style="font-size:9.5px;fill:#54627a">совет пить чай при боли</text>
<text x="562.00" y="180.00" text-anchor="middle" class="bold" style="font-size:15px;fill:#b23b54">→</text>
<rect x="574.00" y="138.00" width="152.00" height="74.00" rx="6" fill="#fff" stroke="#ffcdd2" stroke-width="1"/>
<text x="582.00" y="158.00" text-anchor="start" class="bold" style="font-size:10.5px;fill:#b23b54">4. Ликвидация</text>
<text x="582.00" y="178.00" text-anchor="start" class="" style="font-size:9.5px;fill:#54627a">Разрыв контрактов NHS,</text>
<text x="582.00" y="194.00" text-anchor="start" class="" style="font-size:9.5px;fill:#54627a">обвал акций и банкротство</text>
<rect x="32.00" y="248.00" width="696.00" height="154.00" rx="8" fill="#f0fdf4" stroke="#178477" stroke-width="1.5"/>
<rect x="46.00" y="258.00" width="200.00" height="26.00" rx="6" fill="#178477"/>
<text x="146.00" y="275.00" text-anchor="middle" class="bold" style="font-size:11px;fill:#fff">Эталон: ЕМИАС (Москва)</text>
<text x="260.00" y="275.00" text-anchor="start" class="bold" style="font-size:11.5px;fill:#178477">Крупнейшая в мире единая система лучевой диагностики и ИИ</text>
<rect x="46.00" y="294.00" width="210.00" height="86.00" rx="6" fill="#fff" stroke="#c8e6c9" stroke-width="1"/>
<text x="56.00" y="314.00" text-anchor="start" class="bold" style="font-size:11px;fill:#178477">Шаг 1. Процессы</text>
<text x="56.00" y="334.00" text-anchor="start" class="" style="font-size:9.5px;fill:#54627a">• Унификация расписаний и норм</text>
<text x="56.00" y="351.00" text-anchor="start" class="" style="font-size:9.5px;fill:#54627a">• Стандартизация маршрутов</text>
<text x="56.00" y="368.00" text-anchor="start" class="" style="font-size:9.5px;fill:#54627a">• Единые справочники нозологий</text>
<text x="267.50" y="342.00" text-anchor="middle" class="bold" style="font-size:16px;fill:#178477">→</text>
<rect x="279.00" y="294.00" width="210.00" height="86.00" rx="6" fill="#fff" stroke="#c8e6c9" stroke-width="1"/>
<text x="289.00" y="314.00" text-anchor="start" class="bold" style="font-size:11px;fill:#178477">Шаг 2. Цифровой контур</text>
<text x="289.00" y="334.00" text-anchor="start" class="" style="font-size:9.5px;fill:#54627a">• Сквозная медкарта (ЭМК)</text>
<text x="289.00" y="351.00" text-anchor="start" class="" style="font-size:9.5px;fill:#54627a">• Подключение аппаратов КТ/МРТ</text>
<text x="289.00" y="368.00" text-anchor="start" class="" style="font-size:9.5px;fill:#54627a">• Облачный архив снимков (ЕРИС)</text>
<text x="500.50" y="342.00" text-anchor="middle" class="bold" style="font-size:16px;fill:#178477">→</text>
<rect x="512.00" y="294.00" width="210.00" height="86.00" rx="6" fill="#fff" stroke="#c8e6c9" stroke-width="1"/>
<text x="522.00" y="314.00" text-anchor="start" class="bold" style="font-size:11px;fill:#178477">Шаг 3. ИИ-ассистент</text>
<text x="522.00" y="334.00" text-anchor="start" class="" style="font-size:9.5px;fill:#54627a">• Автоматический второй просмотр</text>
<text x="522.00" y="351.00" text-anchor="start" class="" style="font-size:9.5px;fill:#54627a">• Подсветка ранних признаков рака</text>
<text x="522.00" y="368.00" text-anchor="start" class="" style="font-size:9.5px;fill:#54627a">• Помощник, но не замена врача</text>
<rect x="32.00" y="420.00" width="696.00" height="46.00" rx="6" fill="#edf2fc" stroke="#c5d5f5" stroke-width="1"/>
<text x="380.00" y="440.00" text-anchor="middle" class="bold" style="font-size:11px;fill:#3859b5">Золотое правило цифровизации: Оцифрованный хаос = Автоматизированный хаос с тройным бюджетом.</text>
<text x="380.00" y="456.00" text-anchor="middle" class="" style="font-size:10px;fill:#54627a">Цифровой контур и ИИ внедряются ТОЛЬКО после стабилизации и аудита базовых клинических процессов.</text>
</svg>
