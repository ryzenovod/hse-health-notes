<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
<title id="title">Функции финансирования здравоохранения (Joseph Kutzin, 2000)</title>
<desc id="desc">Четыре взаимосвязанные функции финансирования здравоохранения: сбор средств, объединение в пулы, покупка помощи и предоставление услуг.</desc>
<style>
  text { font-family: Inter, system-ui, -apple-system, sans-serif; fill: #18213a; font-size: 13px; }
  .title { font-size: 19px; font-weight: 700; fill: #18213a; }
  .subtitle { font-size: 13px; fill: #54627a; }
  .bold { font-weight: 600; }
  .small { font-size: 11.5px; fill: #475569; }
  .step-title { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .arrow { stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
</style>

<rect width="760" height="460" rx="12" fill="#ffffff"/>

<!-- Header -->
<text x="32" y="34" class="title">Четыре функции финансирования здравоохранения (Kutzin, 2000)</text>
<text x="32" y="56" class="subtitle">Институциональный цикл движения ресурсов в национальных системах здравоохранения (SHA 2011 / WHO)</text>

<!-- STEP 1: Revenue Collection -->
<g transform="translate(35, 90)">
  <rect x="0" y="0" width="155" height="260" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="0" y="0" width="155" height="44" rx="8" fill="#2563eb"/>
  <text x="77" y="27" text-anchor="middle" class="step-title">1. Сбор средств</text>
  <text x="12" y="65" class="bold" style="font-size: 11px; fill: #1e40af;">Revenue Collection</text>
  
  <text x="12" y="88" class="small">• Налоги (общие, целевые)</text>
  <text x="12" y="108" class="small">• Взносы ОМС (работодатели и работники)</text>
  <text x="12" y="138" class="small">• Бюджетные трансферты за неработающих</text>
  <text x="12" y="168" class="small">• Премии ДМС</text>
  <text x="12" y="188" class="small">• Прямые соплатежи (Out-of-pocket)</text>
  
  <rect x="10" y="210" width="135" height="38" rx="4" fill="#eff6ff"/>
  <text x="77" y="226" text-anchor="middle" class="bold" style="font-size: 10px; fill: #1e40af;">Ключевой вызов:</text>
  <text x="77" y="240" text-anchor="middle" style="font-size: 9.5px; fill: #475569;">Фискальная устойчивость</text>
</g>

<!-- Arrow 1 -> 2 -->
<path d="M 195,220 L 220,220" class="arrow" stroke="#2563eb"/>
<polygon points="218,215 228,220 218,225" fill="#2563eb"/>

<!-- STEP 2: Pooling -->
<g transform="translate(230, 90)">
  <rect x="0" y="0" width="155" height="260" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="0" y="0" width="155" height="44" rx="8" fill="#0891b2"/>
  <text x="77" y="27" text-anchor="middle" class="step-title">2. Пулинг средств</text>
  <text x="12" y="65" class="bold" style="font-size: 11px; fill: #0e7490;">Pooling (Объединение)</text>
  
  <text x="12" y="88" class="small">• Аккумулирование в единый целевой фонд</text>
  <text x="12" y="118" class="small">• Сглаживание рисков (закон больших чисел)</text>
  <text x="12" y="148" class="small">• Защита от катастрофических расходов</text>
  <text x="12" y="178" class="small">• Межрегиональное выравнивание рисков</text>
  
  <rect x="10" y="210" width="135" height="38" rx="4" fill="#ecfeff"/>
  <text x="77" y="226" text-anchor="middle" class="bold" style="font-size: 10px; fill: #0e7490;">Ключевой вызов:</text>
  <text x="77" y="240" text-anchor="middle" style="font-size: 9.5px; fill: #475569;">Размер и фрагментация пула</text>
</g>

<!-- Arrow 2 -> 3 -->
<path d="M 390,220 L 415,220" class="arrow" stroke="#0891b2"/>
<polygon points="413,215 423,220 413,225" fill="#0891b2"/>

<!-- STEP 3: Purchasing -->
<g transform="translate(425, 90)">
  <rect x="0" y="0" width="155" height="260" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="0" y="0" width="155" height="44" rx="8" fill="#16a34a"/>
  <text x="77" y="27" text-anchor="middle" class="step-title">3. Оплата помощи</text>
  <text x="12" y="65" class="bold" style="font-size: 11px; fill: #166534;">Purchasing (Закупка)</text>
  
  <text x="12" y="88" class="small">• Стратегическая vs пассивная закупка</text>
  <text x="12" y="118" class="small">• Подушевой норматив (амбулатория)</text>
  <text x="12" y="148" class="small">• КСГ / DRG (стационары)</text>
  <text x="12" y="178" class="small">• Глобальный бюджет и селективные контракты</text>
  
  <rect x="10" y="210" width="135" height="38" rx="4" fill="#f0fdf4"/>
  <text x="77" y="226" text-anchor="middle" class="bold" style="font-size: 10px; fill: #166534;">Ключевой вызов:</text>
  <text x="77" y="240" text-anchor="middle" style="font-size: 9.5px; fill: #475569;">Стимулы эффективности</text>
</g>

<!-- Arrow 3 -> 4 -->
<path d="M 585,220 L 610,220" class="arrow" stroke="#16a34a"/>
<polygon points="608,215 618,220 608,225" fill="#16a34a"/>

<!-- STEP 4: Service Provision -->
<g transform="translate(620, 90)">
  <rect x="0" y="0" width="115" height="260" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="0" y="0" width="115" height="44" rx="8" fill="#d97706"/>
  <text x="57" y="27" text-anchor="middle" class="step-title">4. Услуги</text>
  <text x="10" y="65" class="bold" style="font-size: 11px; fill: #b45309;">Provision</text>
  
  <text x="10" y="88" class="small">• Поликлиники (ПМСП)</text>
  <text x="10" y="118" class="small">• Больницы и стационары</text>
  <text x="10" y="148" class="small">• Скорая помощь</text>
  <text x="10" y="178" class="small">• Высокотехнологичная помощь</text>
  
  <rect x="8" y="210" width="99" height="38" rx="4" fill="#fef3c7"/>
  <text x="57" y="226" text-anchor="middle" class="bold" style="font-size: 9.5px; fill: #b45309;">Результат:</text>
  <text x="57" y="240" text-anchor="middle" style="font-size: 9px; fill: #475569;">Здоровье граждан</text>
</g>

<!-- Bottom Summary Bar -->
<rect x="35" y="375" width="700" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="50" y="398" class="bold" style="font-size: 12.5px; fill: #1e293b;">Современный тренд развития функций (по С. В. Шишкину):</text>
<text x="50" y="420" class="small" style="fill: #334155;">
  Конвергенция систем происходит в механизмах <tspan font-weight="600" fill="#16a34a">закупки/оплаты (квазирынок, КСГ)</tspan> и росте доли бюджетных трансфертов при <tspan font-weight="600" fill="#2563eb">сборе средств</tspan>. Различия в пулинге сохраняются.
</text>

</svg>
