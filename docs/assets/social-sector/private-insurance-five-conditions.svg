<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
<title id="title">Пять технических условий функционирования частного страхового рынка</title>
<desc id="desc">Критерии эффективности частного страхового пула: независимость рисков, вероятность меньше единицы, оцениваемость, отсутствие отрицательного отбора и морального риска.</desc>
<style>
  text { font-family: Inter, system-ui, -apple-system, sans-serif; fill: #1e293b; font-size: 13px; }
  .title { font-size: 19px; font-weight: 700; fill: #0f172a; }
  .subtitle { font-size: 13px; fill: #64748b; }
  .card-bg { rx: 10px; stroke-width: 1.5; }
  .card-header { font-size: 14px; font-weight: 700; }
  .badge-bg { rx: 4px; }
  .badge-text { font-size: 11px; font-weight: 600; text-anchor: middle; }
  .body-text { font-size: 12px; fill: #334155; line-height: 1.4; }
  .case-title { font-size: 11.5px; font-weight: 600; fill: #0f172a; }
  .case-text { font-size: 11px; fill: #475569; }
</style>

<rect width="760" height="500" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

<!-- Header -->
<text x="32" y="34" class="title">5 технических условий функционирования частного страхового рынка</text>
<text x="32" y="56" class="subtitle">Математические и институциональные требования к безубыточности коммерческого страхового пула</text>

<!-- Row 1: 3 cards (Top) -->
<!-- Card 1: Independence of probabilities -->
<g transform="translate(32, 75)">
  <rect width="216" height="190" class="card-bg" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="0" y="0" width="216" height="38" rx="10" fill="#f1f5f9"/>
  <rect x="0" y="26" width="216" height="12" fill="#f1f5f9"/>
  <text x="12" y="25" class="card-header" fill="#1e3a8a">1. Независимость рисков</text>
  
  <rect x="12" y="48" width="105" height="20" class="badge-bg" fill="#dbeafe"/>
  <text x="64" y="62" class="badge-text" fill="#1d4ed8">cov(Xᵢ, Xⱼ) = 0</text>
  
  <text x="12" y="86" class="body-text">Наступление случая у одного</text>
  <text x="12" y="103" class="body-text">не должно вызывать его у всех.</text>
  <text x="12" y="120" class="body-text">Нет систематического шока.</text>
  
  <rect x="10" y="132" width="196" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="18" y="150" class="case-title">Кейс полисов ВЗР:</text>
  <text x="18" y="167" class="case-text">Исключены эпидемии, войны, цунами</text>
</g>

<!-- Card 2: Probability p < 1 -->
<g transform="translate(272, 75)">
  <rect width="216" height="190" class="card-bg" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="0" y="0" width="216" height="38" rx="10" fill="#f1f5f9"/>
  <rect x="0" y="26" width="216" height="12" fill="#f1f5f9"/>
  <text x="12" y="25" class="card-header" fill="#1e3a8a">2. Вероятность p &lt; 1</text>
  
  <rect x="12" y="48" width="95" height="20" class="badge-bg" fill="#fef3c7"/>
  <text x="59" y="62" class="badge-text" fill="#b45309">Риск не 100%</text>
  
  <text x="12" y="86" class="body-text">Событие не гарантировано.</text>
  <text x="12" y="103" class="body-text">Нельзя застраховать уже</text>
  <text x="12" y="120" class="body-text">наступивший факт ущерба.</text>
  
  <rect x="10" y="132" width="196" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="18" y="150" class="case-title">Кейс в медицине:</text>
  <text x="18" y="167" class="case-text">Хронические болезни, беременность</text>
</g>

<!-- Card 3: Estimability of risks -->
<g transform="translate(512, 75)">
  <rect width="216" height="190" class="card-bg" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="0" y="0" width="216" height="38" rx="10" fill="#f1f5f9"/>
  <rect x="0" y="26" width="216" height="12" fill="#f1f5f9"/>
  <text x="12" y="25" class="card-header" fill="#1e3a8a">3. Оцениваемость</text>
  
  <rect x="12" y="48" width="115" height="20" class="badge-bg" fill="#dcfce7"/>
  <text x="69" y="62" class="badge-text" fill="#15803d">Актуарная база</text>
  
  <text x="12" y="86" class="body-text">Наличие больших массивов</text>
  <text x="12" y="103" class="body-text">исторических данных для</text>
  <text x="12" y="120" class="body-text">расчёта справедливой премии.</text>
  
  <rect x="10" y="132" width="196" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="18" y="150" class="case-title">Кейс атомных АЭС:</text>
  <text x="18" y="167" class="case-text">&lt; 50 аварий: страхует пул МАГАТЭ</text>
</g>

<!-- Row 2: 2 cards (Bottom) - Information Asymmetry Failures -->
<!-- Card 4: Adverse Selection -->
<g transform="translate(32, 280)">
  <rect width="336" height="200" class="card-bg" fill="#ffffff" stroke="#fca5a5"/>
  <rect x="0" y="0" width="336" height="38" rx="10" fill="#fef2f2"/>
  <rect x="0" y="26" width="336" height="12" fill="#fef2f2"/>
  <text x="16" y="25" class="card-header" fill="#991b1b">4. Нет отрицательного отбора (Adverse Selection)</text>
  
  <rect x="16" y="48" width="145" height="20" class="badge-bg" fill="#fee2e2"/>
  <text x="88" y="62" class="badge-text" fill="#b91c1c">Скрытая информация ДО</text>
  
  <text x="16" y="86" class="body-text">Клиент знает о своих скрытых рисках больше страховщика.</text>
  <text x="16" y="103" class="body-text">При едином среднем тарифе здоровые выходят из пула,</text>
  <text x="16" y="120" class="body-text">остаются больные → спираль взвинчивания цен и банкротство.</text>
  
  <rect x="14" y="132" width="308" height="56" rx="6" fill="#f8fafc" stroke="#fee2e2"/>
  <text x="22" y="150" class="case-title">Кейс корпоративного ДМС НИУ ВШЭ:</text>
  <text x="22" y="166" class="case-text">Преподаватели старше и чаще обращаются; молодые платят</text>
  <text x="22" y="180" class="case-text">сами и уходят, старшие получают бесплатно → убытки к июлю.</text>
</g>

<!-- Card 5: Moral Hazard -->
<g transform="translate(392, 280)">
  <rect width="336" height="200" class="card-bg" fill="#ffffff" stroke="#fed7aa"/>
  <rect x="0" y="0" width="336" height="38" rx="10" fill="#fff7ed"/>
  <rect x="0" y="26" width="336" height="12" fill="#fff7ed"/>
  <text x="16" y="25" class="card-header" fill="#9a3412">5. Нет морального риска (Moral Hazard)</text>
  
  <rect x="16" y="48" width="140" height="20" class="badge-bg" fill="#ffedd5"/>
  <text x="86" y="62" class="badge-text" fill="#c2410c">Скрытые действия ПОСЛЕ</text>
  
  <text x="16" y="86" class="body-text">Поведение клиента меняется после получения полиса:</text>
  <text x="16" y="103" class="body-text">беспечность, пренебрежение здоровьем, избыточное</text>
  <text x="16" y="120" class="body-text">потребление («всё оплачено») и приписки клиник.</text>
  
  <rect x="14" y="132" width="308" height="56" rx="6" fill="#f8fafc" stroke="#ffedd5"/>
  <text x="22" y="150" class="case-title">Два проявления в медицине:</text>
  <text x="22" y="166" class="case-text">Пациент: 10 бесплатных массажей по фиктивному ВСД;</text>
  <text x="22" y="180" class="case-text">Врач: спрос, спровоцированный предложением (кесарево сечение).</text>
</g>
</svg>
