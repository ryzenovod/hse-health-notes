<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc">
<title id="title">Экономика «домика»: ловушка советской инфраструктуры и антикризисные рычаги</title>
<desc id="desc">Схема роста себестоимости посещения при демографическом спаде и четыре рычага главного врача по оптимизации инфраструктуры.</desc>
<style>
  text { font-family: Inter, system-ui, -apple-system, sans-serif; fill: #18213a; font-size: 13px; }
  .title { font-size: 19px; font-weight: 700; fill: #18213a; }
  .subtitle { font-size: 13px; fill: #54627a; }
  .bold { font-weight: 600; }
  .small { font-size: 11.5px; fill: #475569; }
  .arrow { stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
</style>

<rect width="760" height="480" rx="12" fill="#ffffff"/>

<!-- Header -->
<text x="32" y="34" class="title">Экономика «домика»: инфраструктурная ловушка поликлиник</text>
<text x="32" y="56" class="subtitle">Рост удельной себестоимости при оттоке населения и четыре антикризисных рычага главного врача</text>

<!-- STEP 1: History -->
<g transform="translate(30, 85)">
  <rect x="0" y="0" width="200" height="110" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="0" y="0" width="200" height="30" rx="8" fill="#475569"/>
  <text x="100" y="20" text-anchor="middle" class="bold" style="fill: #ffffff; font-size: 11.5px;">1. Проект 1970–80-х гг.</text>
  <text x="12" y="48" class="small">• Поликлиника на 100 тыс. жителей</text>
  <text x="12" y="66" class="small">• Мощность: 750 посещений в смену</text>
  <text x="12" y="84" class="small">• Постоянные затраты ЖКХ и тепла</text>
  <text x="12" y="100" class="bold" style="fill: #475569; font-size: 11px;">Базовые OPEX = 100 у.е.</text>
</g>

<!-- Arrow 1 -> 2 -->
<path d="M 235,140 L 265,140" class="arrow" stroke="#dc2626"/>
<polygon points="263,135 273,140 263,145" fill="#dc2626"/>

<!-- STEP 2: Demographic Shift -->
<g transform="translate(275, 85)">
  <rect x="0" y="0" width="200" height="110" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="0" y="0" width="200" height="30" rx="8" fill="#ef4444"/>
  <text x="100" y="20" text-anchor="middle" class="bold" style="fill: #ffffff; font-size: 11.5px;">2. Демографический спад</text>
  <text x="12" y="48" class="small">• Отток и старение населения</text>
  <text x="12" y="66" class="small">• Реальный поток: 250 в смену</text>
  <text x="12" y="84" class="small">• Пустующие площади и коридоры</text>
  <text x="12" y="100" class="bold" style="fill: #dc2626; font-size: 11px;">Постоянные затраты те же!</text>
</g>

<!-- Arrow 2 -> 3 -->
<path d="M 480,140 L 510,140" class="arrow" stroke="#dc2626"/>
<polygon points="508,135 518,140 508,145" fill="#dc2626"/>

<!-- STEP 3: Financial Trap -->
<g transform="translate(520, 85)">
  <rect x="0" y="0" width="210" height="110" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <rect x="0" y="0" width="210" height="30" rx="8" fill="#e11d48"/>
  <text x="105" y="20" text-anchor="middle" class="bold" style="fill: #ffffff; font-size: 11.5px;">3. Ловушка тарифа ОМС</text>
  <text x="10" y="50" class="bold" style="fill: #be123c; font-size: 11.5px;">Себестоимость посещения ↑</text>
  <text x="10" y="68" class="small">Тариф ОМС усреднён и</text>
  <text x="10" y="82" class="bold" style="fill: #be123c; font-size: 11px;">НЕ оплачивает пустые площади</text>
  <text x="10" y="98" class="small">и неработающий коечный фонд</text>
</g>

<!-- Arrow Down to Levers -->
<path d="M 380,205 L 380,230" class="arrow" stroke="#2563eb"/>
<polygon points="375,230 380,238 385,230" fill="#2563eb"/>

<!-- SECTION 4: 4 Anti-crisis Levers of Head Doctor -->
<rect x="30" y="242" width="700" height="215" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="30" y="242" width="700" height="34" rx="10" fill="#1e40af"/>
<text x="380" y="264" text-anchor="middle" class="bold" style="fill: #ffffff; font-size: 13.5px;">Четыре управленческих рычага главного врача по ликвидации дефицита</text>

<!-- Lever 1 -->
<g transform="translate(45, 290)">
  <rect x="0" y="0" width="155" height="150" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
  <rect x="0" y="0" width="155" height="26" rx="6" fill="#eff6ff"/>
  <text x="77" y="18" text-anchor="middle" class="bold" style="font-size: 11px; fill: #1e40af;">1. Энергосбережение</text>
  <text x="10" y="45" class="bold" style="font-size: 11px; fill: #1e293b;">Сокращение OPEX:</text>
  <text x="10" y="65" class="small">• Утепление фасадов</text>
  <text x="10" y="82" class="small">• Замена стеклопакетов</text>
  <text x="10" y="99" class="small">• Автоматика теплоузлов</text>
  <text x="10" y="125" class="bold" style="font-size: 10px; fill: #16a34a;">Кейс клиники в Крыму:</text>
  <text x="10" y="140" style="font-size: 9.5px; fill: #64748b;">экономия тепла до 35%</text>
</g>

<!-- Lever 2 -->
<g transform="translate(215, 290)">
  <rect x="0" y="0" width="155" height="150" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
  <rect x="0" y="0" width="155" height="26" rx="6" fill="#eff6ff"/>
  <text x="77" y="18" text-anchor="middle" class="bold" style="font-size: 11px; fill: #1e40af;">2. Привлечение потока</text>
  <text x="10" y="45" class="bold" style="font-size: 11px; fill: #1e293b;">Рост базы ОМС:</text>
  <text x="10" y="65" class="small">• Пациенты из соседних</text>
  <text x="10" y="80" class="small">районов города</text>
  <text x="10" y="99" class="small">• Уникальные профили</text>
  <text x="10" y="114" class="small">(сурдология, диабет)</text>
  <text x="10" y="138" class="small">• Рост числа посещений</text>
</g>

<!-- Lever 3 -->
<g transform="translate(385, 290)">
  <rect x="0" y="0" width="155" height="150" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
  <rect x="0" y="0" width="155" height="26" rx="6" fill="#eff6ff"/>
  <text x="77" y="18" text-anchor="middle" class="bold" style="font-size: 11px; fill: #1e40af;">3. ПДД и Аренда*</text>
  <text x="10" y="45" class="bold" style="font-size: 11px; fill: #1e293b;">Внебюджетные доходы:</text>
  <text x="10" y="65" class="small">• Платные медуслуги</text>
  <text x="10" y="82" class="small">• Сдача помещений в</text>
  <text x="10" y="97" class="small">аренду аптекам и МРТ</text>
  <text x="10" y="122" class="bold" style="font-size: 10px; fill: #b45309;">*Только с согласия</text>
  <text x="10" y="137" style="font-size: 9.5px; fill: #b45309;">учредителя (КУГИ)</text>
</g>

<!-- Lever 4 -->
<g transform="translate(555, 290)">
  <rect x="0" y="0" width="155" height="150" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
  <rect x="0" y="0" width="155" height="26" rx="6" fill="#eff6ff"/>
  <text x="77" y="18" text-anchor="middle" class="bold" style="font-size: 11px; fill: #1e40af;">4. Сброс площадей</text>
  <text x="10" y="45" class="bold" style="font-size: 11px; fill: #1e293b;">Возврат в казну:</text>
  <text x="10" y="65" class="small">• Передача пустующих</text>
  <text x="10" y="80" class="small">этажей и корпусов</text>
  <text x="10" y="97" class="small">в казну региона</text>
  <text x="10" y="117" class="small">• Снятие расходов на</text>
  <text x="10" y="132" class="small">ЖКХ, налог на имущество</text>
</g>

</svg>
