<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title id="title">Нормирование времени приема терапевта: экономический компромисс</title><desc id="desc">Сравнение фактических хронометражных замеров ЦНИИОИЗ и утвержденного норматива Минздрава.</desc>
<style>text{font-family:Inter,system-ui,-apple-system,sans-serif;fill:#18213a;font-size:16px} .small{font-size:14px;fill:#54627a} .heading{font-size:21px;font-weight:700} .bold{font-weight:600}</style>
<rect width="760" height="430" rx="12" fill="#fff"/>
<text x="32.00" y="40.00" text-anchor="start" class="heading" style="fill:#18213a">Нормирование времени приема терапевта: экономический компромисс</text>
<text x="32.00" y="68.00" text-anchor="start" class="small" style="fill:#18213a">Приказ Минздрава России № 290н и данные фотохронометражных исследований</text>
<rect x="32.00" y="100.00" width="330.00" height="270.00" rx="8" fill="#fff2f2" stroke="#b23b54" stroke-width="2"/>
<rect x="32.00" y="100.00" width="330.00" height="40.00" rx="8" fill="#b23b54"/>
<rect x="32.00" y="128.00" width="330.00" height="12.00" rx="0" fill="#b23b54"/>
<text x="197.00" y="126.00" text-anchor="middle" class="bold" style="font-size:14px;fill:#fff">Реальный хронометраж (ЦНИИОИЗ)</text>
<text x="197.00" y="180.00" text-anchor="middle" class="heading" style="font-size:26px;fill:#b23b54">25–28 минут</text>
<text x="197.00" y="205.00" text-anchor="middle" class="" style="font-size:12px;fill:#54627a">фактическое время качественного приема</text>
<text x="48.00" y="240.00" text-anchor="start" class="" style="font-size:12px;fill:#18213a">• Осмотр, сбор анамнеза, опрос: 12–15 мин</text>
<text x="48.00" y="262.00" text-anchor="start" class="" style="font-size:12px;fill:#18213a">• Заполнение ЕМИАС / документация: 8–10 мин</text>
<text x="48.00" y="284.00" text-anchor="start" class="" style="font-size:12px;fill:#18213a">• Разъяснение схемы лечения: 4–5 мин</text>
<path d="M48.000,300.000 L346.000,300.000" fill="none" stroke="#f5c6cb" stroke-width="2"/>
<text x="48.00" y="320.00" text-anchor="start" class="bold" style="font-size:12px;fill:#b23b54">Экономическое последствие:</text>
<text x="48.00" y="340.00" text-anchor="start" class="" style="font-size:11px;fill:#b23b54">Потребовалось бы почти в 2 раза больше врачей</text>
<text x="48.00" y="356.00" text-anchor="start" class="" style="font-size:11px;fill:#b23b54">и удвоение фонда оплаты труда</text>
<rect x="398.00" y="100.00" width="330.00" height="270.00" rx="8" fill="#eef8f6" stroke="#178477" stroke-width="2"/>
<rect x="398.00" y="100.00" width="330.00" height="40.00" rx="8" fill="#178477"/>
<rect x="398.00" y="128.00" width="330.00" height="12.00" rx="0" fill="#178477"/>
<text x="563.00" y="126.00" text-anchor="middle" class="bold" style="font-size:14px;fill:#fff">Типовая норма (Приказ № 290н)</text>
<text x="563.00" y="180.00" text-anchor="middle" class="heading" style="font-size:26px;fill:#178477">15 минут</text>
<text x="563.00" y="205.00" text-anchor="middle" class="" style="font-size:12px;fill:#54627a">управленческая типовая норма Минздрава</text>
<text x="414.00" y="240.00" text-anchor="start" class="" style="font-size:12px;fill:#18213a">• Расчетная норма для планирования штатов</text>
<text x="414.00" y="262.00" text-anchor="start" class="" style="font-size:12px;fill:#18213a">• Обеспечивает функцию врачебной должности</text>
<text x="414.00" y="284.00" text-anchor="start" class="" style="font-size:12px;fill:#18213a">• Ориентир для слотов записи в ЕМИАС</text>
<path d="M414.000,300.000 L712.000,300.000" fill="none" stroke="#bfe5df" stroke-width="2"/>
<text x="414.00" y="320.00" text-anchor="start" class="bold" style="font-size:12px;fill:#178477">Практика и автономия МО:</text>
<text x="414.00" y="340.00" text-anchor="start" class="" style="font-size:11px;fill:#18213a">Клиники могут утверждать локальные нормы</text>
<text x="414.00" y="356.00" text-anchor="start" class="" style="font-size:11px;fill:#18213a">и вводить буферные интервалы для сложных пациентов</text>
<text x="32.00" y="405.00" text-anchor="start" class="small" style="fill:#18213a">Типовая норма служит инструментом макропланирования кадровой потребности отрасли.</text>
</svg>
